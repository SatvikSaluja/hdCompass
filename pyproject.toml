[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdcompass"
version = "0.1.0"
description = "Label-free recovery, decoding and cross-state dynamics of the head-direction compass from thalamic spikes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "pynapple",
  "jax[cpu]",
  "scikit-learn",
  "ripser",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hdcompass = "hdcompass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hdcompass"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
